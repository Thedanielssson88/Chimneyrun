<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#2a1065"/>
    </radialGradient>
    <radialGradient id="tire-grad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Stars / sparkles -->
  <g fill="#fef3c7" opacity="0.8">
    <circle cx="80" cy="70" r="3"/>
    <circle cx="420" cy="60" r="4"/>
    <circle cx="140" cy="140" r="2"/>
    <circle cx="380" cy="180" r="3"/>
  </g>

  <!-- Cactus silhouettes -->
  <g fill="#14532d" opacity="0.85">
    <rect x="50" y="340" width="18" height="80" rx="8"/>
    <rect x="30" y="370" width="12" height="30" rx="5"/>
    <rect x="30" y="370" width="22" height="10" rx="3"/>

    <rect x="440" y="350" width="18" height="80" rx="8"/>
    <rect x="454" y="370" width="22" height="10" rx="3"/>
    <rect x="466" y="370" width="12" height="30" rx="5"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#fef3c7" stroke-width="10" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="240" x2="140" y2="240"/>
    <line x1="70" y1="290" x2="130" y2="290"/>
  </g>

  <!-- Tire (hero) -->
  <g transform="translate(280, 260)">
    <!-- outer tire -->
    <circle r="125" fill="#0f172a"/>
    <circle r="120" fill="url(#tire-grad)" stroke="#0f172a" stroke-width="8"/>
    <!-- treads -->
    <g fill="#0f172a">
      <rect x="-8" y="-125" width="16" height="24" rx="3"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(36)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(72)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(108)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(144)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(180)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(216)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(252)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(288)"/>
      <rect x="-8" y="-125" width="16" height="24" rx="3" transform="rotate(324)"/>
    </g>
    <!-- inner ring -->
    <circle r="75" fill="#f59e0b" stroke="#0f172a" stroke-width="5"/>
    <!-- hub -->
    <circle r="34" fill="#1f2937" stroke="#0f172a" stroke-width="4"/>
    <circle r="18" fill="#374151"/>
    <!-- spokes -->
    <g stroke="#0f172a" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-90"/>
      <line x1="0" y1="30" x2="0" y2="90"/>
      <line x1="-30" y1="0" x2="-90" y2="0"/>
      <line x1="30" y1="0" x2="90" y2="0"/>
    </g>
    <!-- shine -->
    <circle cx="-35" cy="-40" r="16" fill="#fef3c7" opacity="0.6"/>
  </g>
</svg>
